# GoClaw All-in-One — PostgreSQL + pgvector + Web Dashboard + pgAdmin
#
# Quick start (no .env file needed):
#   1. Edit the environment variables below (at minimum: GOCLAW_GATEWAY_TOKEN,
#      GOCLAW_ENCRYPTION_KEY, and one LLM provider API key via dashboard)
#   2. docker compose up -d
#
# Or with .env file:
#   1. Create .env alongside this file with your variables
#   2. docker compose up -d
#
# Generate gateway secrets: openssl rand -hex 32
#
# Dashboard: http://localhost (or https://<domain> if GOCLAW_DOMAIN is set)
# API:       http://localhost/v1/ (via Caddy) or http://localhost:18790 (direct)
# pgAdmin:   http://localhost:5050

services:
  goclaw-stack-core:
    #container_name: goclaw-stack-core
    image: itsddvn/goclaw:v3.4.0
    volumes:
      - goclaw-data:/app/data
      - goclaw-workspace:/app/workspace
      - caddy-data:/data
      - ${GOCLAW_SKILLS_STORE:-/opt/goclaw/data/skills-store}:/app/data/skills-store
    ports:
      - "${GOCLAW_HTTP_PORT:-80}:8080"
      - "${GOCLAW_HTTPS_PORT:-443}:8443"
      - "${GOCLAW_API_PORT:-18790}:18790"
    env_file:
      - path: .env
        required: false
    environment:
      # ── Internal (do not change) ──
      GOCLAW_CONFIG: /app/data/config.json
      GOCLAW_SKILLS_DIR: /app/data/skills
      GOCLAW_POSTGRES_DSN: postgres://${POSTGRES_USER:-goclaw}:${POSTGRES_PASSWORD:-goclaw}@${POSTGRES_HOST:-goclaw-stack-postgres}:5432/${POSTGRES_DB:-goclaw}?sslmode=disable
      # ── Gateway (required — generate with: openssl rand -hex 32) ──
      GOCLAW_GATEWAY_TOKEN: ${GOCLAW_GATEWAY_TOKEN:-}
      GOCLAW_ENCRYPTION_KEY: ${GOCLAW_ENCRYPTION_KEY:-}
      # ── Domain & HTTPS (optional — leave empty for HTTP only) ──
      GOCLAW_DOMAIN: ${GOCLAW_DOMAIN:-}
    depends_on:
      goclaw-stack-postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    init: true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
          pids: 200
    networks:
      - goclaw-internal
      - goclaw-external
    restart: unless-stopped

  goclaw-stack-postgres:
    image: pgvector/pgvector:pg18
    #container_name: goclaw-stack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goclaw}
      POSTGRES_DB: ${POSTGRES_DB:-goclaw}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goclaw} -d ${POSTGRES_DB:-goclaw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - goclaw-internal
    restart: unless-stopped

  pgadmin:
    #container_name: goclaw-stack-pgadmin
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      goclaw-stack-postgres:
        condition: service_healthy
    networks:
      - goclaw-internal
      - goclaw-external
    restart: unless-stopped

networks:
  goclaw-internal:
    driver: bridge
    internal: true
  goclaw-external:
    driver: bridge

volumes:
  goclaw-data:
  goclaw-workspace:
  caddy-data:
  pgdata:
  pgadmin-data:
