name: goclaw-upgrade-release
description: >
  Bump goclaw-core submodule to the latest upstream tag, build the Docker image
  locally, validate the running stack through a browser smoke test, then publish
  (push multi-arch image + commit submodule/compose bumps + create and push a
  matching version tag) if the smoke test passes. Safe to re-run — exits early
  when no newer tag is available.

provider: claude
model: sonnet

nodes:
  # ─────────────────────────────────────────────────────────────────────────
  # 0. Guardrail — refuse to run on a dirty working tree (avoid clobbering
  #    in-progress edits when `make update` rewrites compose files).
  # ─────────────────────────────────────────────────────────────────────────
  - id: guard-clean-worktree
    bash: |
      set -eo pipefail
      # Ignore .archon/ — it's the workflow runtime itself, not part of the release
      DIRTY=$(git status --porcelain | grep -vE '^\?\? .archon/' || true)
      if [ -n "$DIRTY" ]; then
        echo "ERROR: working tree is not clean. Commit or stash before releasing." >&2
        echo "$DIRTY" >&2
        exit 1
      fi
      # Submodule must also be clean
      if ! git diff --quiet --ignore-submodules=none -- goclaw-core; then
        echo "ERROR: goclaw-core submodule has uncommitted changes." >&2
        exit 1
      fi
      echo "clean"
    timeout: 30000

  # ─────────────────────────────────────────────────────────────────────────
  # 1. Detect — fetch upstream tags, read current pin, print both.
  # ─────────────────────────────────────────────────────────────────────────
  - id: detect-version
    bash: |
      set -eo pipefail
      # Ensure submodule is checked out (fresh worktrees don't have it populated)
      git submodule update --init goclaw-core
      cd goclaw-core
      git fetch --tags --quiet
      LATEST_TAG=$(git tag --sort=-v:refname --list 'v[0-9]*' | head -n1)
      cd ..
      CURRENT_COMPOSE_TAG=$(grep -oE 'image: itsddvn/goclaw:v[^[:space:]]+' docker-compose.yml \
        | head -n1 | sed 's/image: itsddvn\/goclaw://')
      echo "latest_tag=$LATEST_TAG"
      echo "current_compose_tag=$CURRENT_COMPOSE_TAG"
    depends_on: [guard-clean-worktree]
    timeout: 120000

  # ─────────────────────────────────────────────────────────────────────────
  # 2. Classify — parse detect-version output into a structured decision.
  # ─────────────────────────────────────────────────────────────────────────
  - id: classify
    prompt: |
      Parse this version check output and decide whether a release is needed.

      Output from detect-version:
      $detect-version.output

      Rules:
      - If latest_tag differs from current_compose_tag, status = "update_available"
      - If they match, status = "up_to_date"
      - latest_version = the latest_tag value verbatim
      - current_version = the current_compose_tag value verbatim

      Reply ONLY with the JSON object matching the schema — no prose.
    depends_on: [detect-version]
    #model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [update_available, up_to_date]
        latest_version:
          type: string
        current_version:
          type: string
      required: [status, latest_version, current_version]

  # ─────────────────────────────────────────────────────────────────────────
  # 3. Update — run `make update` to bump submodule + compose pins.
  #    Skipped when already up-to-date (cascade skips downstream too).
  # ─────────────────────────────────────────────────────────────────────────
  - id: update-submodule
    bash: |
      set -eo pipefail
      echo "=== make update ==="
      make update 2>&1
      echo
      echo "=== compose pin after update ==="
      grep -E 'image: itsddvn/goclaw:' docker-compose.yml || true
      grep -E 'image: itsddvn/goclaw:' docker-compose-dokploy.yml 2>/dev/null || true
    depends_on: [classify]
    when: "$classify.output.status == 'update_available'"
    timeout: 300000

  # ─────────────────────────────────────────────────────────────────────────
  # 4. Build — local single-arch build (--load into Docker).
  #    Tail the last 150 lines so the output fits downstream prompts.
  # ─────────────────────────────────────────────────────────────────────────
  - id: build-local
    bash: |
      set -eo pipefail
      echo "=== make build-local ==="
      make build-local 2>&1
      echo
      echo "=== local images ==="
      docker image ls itsddvn/goclaw --format '{{.Repository}}:{{.Tag}}  {{.Size}}  {{.CreatedSince}}'
    depends_on: [update-submodule]
    timeout: 2700000

  # ─────────────────────────────────────────────────────────────────────────
  # 5a. Smoke up — bring up an isolated compose project on non-default ports,
  #     wait for the dashboard to respond. Deterministic bash, no AI.
  # ─────────────────────────────────────────────────────────────────────────
  - id: smoke-up
    bash: |
      set -eo pipefail
      export COMPOSE_PROJECT=goclaw-smoketest
      export GOCLAW_HTTP_PORT=18080
      export GOCLAW_API_PORT=18791
      export PGADMIN_PORT=15050
      export POSTGRES_PASSWORD=smoketest
      export GOCLAW_GATEWAY_TOKEN=$(openssl rand -hex 32)
      export GOCLAW_ENCRYPTION_KEY=$(openssl rand -hex 32)

      # Persist the chosen ports / creds so downstream nodes can reuse them.
      mkdir -p "$ARTIFACTS_DIR"
      cat > "$ARTIFACTS_DIR/smoke-env.sh" <<EOF
      export COMPOSE_PROJECT=$COMPOSE_PROJECT
      export GOCLAW_HTTP_PORT=$GOCLAW_HTTP_PORT
      export GOCLAW_API_PORT=$GOCLAW_API_PORT
      export PGADMIN_PORT=$PGADMIN_PORT
      export POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      export GOCLAW_GATEWAY_TOKEN=$GOCLAW_GATEWAY_TOKEN
      export GOCLAW_ENCRYPTION_KEY=$GOCLAW_ENCRYPTION_KEY
      EOF

      # Defensive pre-teardown in case a stale project exists from a prior run.
      docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml down -v --remove-orphans >/dev/null 2>&1 || true

      echo "=== docker compose up -d ==="
      docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml up -d

      echo "=== wait for dashboard on :$GOCLAW_HTTP_PORT ==="
      for i in $(seq 1 60); do
        code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$GOCLAW_HTTP_PORT/" || echo 000)
        echo "attempt $i: $code"
        case "$code" in
          2*|3*) echo "ready"; exit 0 ;;
        esac
        sleep 2
      done

      echo "ERROR: dashboard never became ready after 120s" >&2
      docker compose -p "$COMPOSE_PROJECT" logs --tail=80 goclaw-stack-core >&2 || true
      exit 1
    depends_on: [build-local]
    when: "$classify.output.status == 'update_available'"
    timeout: 240000

  # ─────────────────────────────────────────────────────────────────────────
  # 5b. Smoke browser — drive playwright against the running stack, write
  #     $ARTIFACTS_DIR/verdict.json. AI is wrapped in the playwright-cli skill
  #     so it has the tool knowledge it needs. No output_format — the JSON is
  #     parsed by the read-verdict node from the file on disk, which is more
  #     reliable than coaxing the SDK to return structured output from a
  #     long-running browser session.
  # ─────────────────────────────────────────────────────────────────────────
  - id: smoke-browser
    command: browser-smoke-test
    depends_on: [smoke-up]
    context: fresh
    skills:
      - playwright-cli
    idle_timeout: 900000

  # ─────────────────────────────────────────────────────────────────────────
  # 5c. Read verdict — a prompt node (output_format works on prompt nodes,
  #     but is ignored on bash nodes) that reads $ARTIFACTS_DIR/verdict.json
  #     and re-emits it as a validated structured object. Always produces a
  #     fail-default when the file is missing or invalid so downstream
  #     `when:` checks always have something to evaluate.
  # ─────────────────────────────────────────────────────────────────────────
  - id: read-verdict
    prompt: |
      Read the file at `$ARTIFACTS_DIR/verdict.json` using the Read tool.

      - If the file exists AND is valid JSON AND contains `verdict`, `summary`,
        and `new_version` — echo its content as the JSON object matching the
        schema. Use empty array for screenshots if absent.
      - If the file is missing OR not valid JSON OR missing any required
        field — emit exactly:
        {"verdict":"fail","new_version":"unknown","summary":"verdict.json missing or invalid — smoke-browser did not produce a parseable verdict","screenshots":[]}

      Reply ONLY with the JSON object — no prose, no markdown fences.
    depends_on: [smoke-browser]
    trigger_rule: all_done
    model: haiku
    allowed_tools: [Read]
    output_format:
      type: object
      properties:
        verdict:
          type: string
          enum: [pass, fail]
        new_version:
          type: string
          description: The version tag that was smoke-tested (e.g. v3.7.1)
        summary:
          type: string
        screenshots:
          type: array
          items:
            type: string
      required: [verdict, new_version, summary]

  # ─────────────────────────────────────────────────────────────────────────
  # 5d. Smoke down — ALWAYS runs when an update was attempted, even if the
  #     browser step failed or was cancelled. Releases ports + volumes.
  # ─────────────────────────────────────────────────────────────────────────
  - id: smoke-down
    bash: |
      set +e
      docker compose -p goclaw-smoketest -f docker-compose.yml down -v --remove-orphans 2>&1 | tail -n 40
      exit 0
    depends_on: [smoke-up, smoke-browser, read-verdict]
    trigger_rule: all_done
    when: "$classify.output.status == 'update_available'"
    timeout: 180000

  # ─────────────────────────────────────────────────────────────────────────
  # 6. Publish — only when the parsed verdict is pass AND teardown finished.
  # ─────────────────────────────────────────────────────────────────────────
  - id: publish-release
    command: publish-release
    depends_on: [read-verdict, smoke-down, classify]
    when: "$read-verdict.output.verdict == 'pass'"
    context: fresh
    idle_timeout: 1800000

  # ─────────────────────────────────────────────────────────────────────────
  # 7. Report — always runs last, summarises the whole run to artifacts.
  # ─────────────────────────────────────────────────────────────────────────
  - id: report
    prompt: |
      Write a concise release report to $ARTIFACTS_DIR/release-report.md.
      Use the information below. Keep it short (≤ 40 lines, markdown).

      Classification:
      $classify.output

      Smoke test verdict:
      $read-verdict.output

      Teardown:
      $smoke-down.output

      Publish step:
      $publish-release.output

      Structure:
      # goclaw release report
      - Current → new version
      - Smoke test verdict + summary
      - Publish outcome (image pushed? commit sha? tag?)
      - Screenshots (list paths if any)
      - Any cleanup notes

      After writing, print the absolute path of the report file you wrote.
    depends_on: [classify, read-verdict, smoke-down, publish-release]
    trigger_rule: all_done
    #model: haiku
    allowed_tools: [Write, Bash]
